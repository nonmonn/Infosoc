
services:
  # 1. Servidor de la PWA (Angular)
  frontend:
    build: 
      context: ./app-hospital-pwa
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    #command: npx ng serve --host 0.0.0.0
    volumes:
      - ./app-hospital-pwa:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - api
#servidor en node.js
  api:
    build:
      context: ./api-hospital
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./api-hospital:/app
      - /app/node_modules
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=hospital_user
      - DB_PASSWORD=hospital_pass
      - DB_NAME=hospital_db
    depends_on:
      - db

  # 3. Servidor de Base de Datos
  db:
    image: mysql:8.0
    container_name: hospital_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_hospital_pass
      MYSQL_DATABASE: hospital_db
      MYSQL_USER: hospital_user
      MYSQL_PASSWORD: hospital_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: