server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las llamadas a /api van al backend (así solo necesitas UN link de Cloudflare)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Estos archivos NO deben quedar cacheados por el navegador,
  # si no, las actualizaciones de la app nunca llegan al celular
  location = /ngsw.json      { add_header Cache-Control "no-cache"; }
  location = /ngsw-worker.js { add_header Cache-Control "no-cache"; }
  location = /index.html     { add_header Cache-Control "no-cache"; }

  # Rutas de Angular (/dashboard, /rutas, /mis-rutas...) -> index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
