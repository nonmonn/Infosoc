<div class="min-h-screen bg-gray-50 p-4 sm:p-8 font-sans flex flex-col items-center">
  
  <!-- 1. CABECERA LIMPIA (Sin inputs) -->
  <div class="bg-white rounded-3xl p-6 sm:p-8 shadow-sm flex flex-col items-center w-full max-w-md mb-8 mt-4 text-center">
    <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mb-4">
      <span class="text-3xl">🗺️</span>
    </div>
    <h2 class="text-2xl font-bold mb-2 text-gray-800">Tu Ruta Óptima</h2>
    
    <div class="bg-orange-50 text-orange-600 font-semibold px-4 py-3 rounded-xl w-full border border-orange-100 mb-2">
      📍 Generando recorrido interactivo...
    </div>
    <p class="text-xs text-gray-400 mt-2">Guiando desde Recepción hacia tu destino</p>
  </div>

  <!-- 2. ESTADOS DE CARGA -->
  @if (cargando) {
    <div class="text-center text-orange-500 font-bold animate-pulse mb-8 flex flex-col items-center gap-2">
      <span class="text-3xl animate-spin">⏳</span>
      <p>Procesando el camino más corto...</p>
    </div>
  }

  <!-- 3. RESULTADOS (AHORA CON PREVISUALIZACIÓN) -->
  @if (!cargando && instruccionesRuta.length > 0) {
    <div class="w-full max-w-md flex flex-col gap-8 pb-12 animate-fade-in">
      
      @for (paso of instruccionesRuta; track paso.id) {
        <div class="bg-white rounded-[2.5rem] p-5 border-8 border-gray-100 flex flex-col items-center justify-between shadow-lg">
          
          <!-- Contenedor de la foto -->
          <div class="w-full h-48 sm:h-64 flex items-center justify-center mb-4 rounded-2xl overflow-hidden bg-gray-100">
            <img [src]="paso.imagenUrl" alt="Vista del pasillo" class="w-full h-full object-cover">
          </div>
          
          <!-- Contenedor de la instrucción y el pictograma -->
          <div class="text-center w-full flex flex-col items-center pb-2 pt-2 border-t border-gray-50">
            <img [src]="paso.pictograma.imagenUrl" [alt]="paso.pictograma.titulo" class="w-16 h-16 object-contain mb-3 drop-shadow-md">
            <span class="font-bold text-gray-700 text-lg">{{ paso.instruccion }}</span>
          </div>

        </div>
      }
      
      <!-- Botón para volver al inicio -->
      <button routerLink="/dashboard" class="mt-4 bg-gray-200 text-gray-700 px-6 py-4 rounded-full font-bold hover:bg-gray-300 w-full transition text-lg shadow-sm">
        🔙 Finalizar y volver al menú
      </button>

    </div>
  }

</div>
